version: '3.8'

services:
  # Frontend Service - Next.js 16+
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - BETTER_AUTH_PUBLIC_KEY=${BETTER_AUTH_PUBLIC_KEY:-placeholder}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - todo-network
    depends_on:
      - backend
    command: npm run dev

  # Backend Service - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://placeholder}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-placeholder-secret}
    volumes:
      - ./backend:/app
    networks:
      - todo-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

networks:
  todo-network:
    driver: bridge
