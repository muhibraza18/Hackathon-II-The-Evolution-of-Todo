# Dapr Configuration for DigitalOcean Kubernetes (DOKS)
# Cloud-specific configuration

apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: default
spec:
  # Tracing configuration
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.default.svc.cluster.local:9411/api/v2/spans"
  # Metrics enabled
  metric:
    enabled: true
  # HTTP pipeline
  httpPipeline:
    handlers: []
  # Feature flags
  features:
    - name: AppHealthCheck
      enabled: true
  # Secrets configuration
  secrets:
    scopes:
    - storeName: kubernetes-secrets
      defaultAccess: allow
