apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "todo-kafka-kafka-bootstrap.kafka:9092"  # Kafka cluster bootstrap server
  - name: authRequired
    value: "false"  # For local development - set to true in production
  - name: consumerGroup
    value: "todo-ai-chatbot-group"
  - name: disableTls
    value: "true"  # Disable TLS for local development
  - name: version
    value: "3.6.0"
  - name: maxMessageBytes
    value: "1048576"
  - name: consumeRetryInterval
    value: "100ms"
  - name: publishTimeout
    value: "30s"
  - name: dialTimeout
    value: "10s"
  - name: readTimeout
    value: "30s"
  - name: writeTimeout
    value: "30s"