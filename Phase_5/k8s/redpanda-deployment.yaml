apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-config
  namespace: default
data:
  redpanda.yaml: |
    redpanda:
      data_directory: /var/lib/redpanda/data
      seed_servers: []
      rpc_server:
        address: 0.0.0.0
        port: 33145
      advertised_rpc_api:
        address: redpanda-service
        port: 33145
      kafka_api:
        address: 0.0.0.0
        port: 9092
      advertised_kafka_api:
        address: redpanda-service
        port: 9092
      admin:
        address: 0.0.0.0
        port: 9644
      developer_mode: true
      auto_create_topics_enabled: true
      enable_metrics: false
      enable_pid_file: false
      log_level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: default
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
        dapr.io/enabled: "true"
        dapr.io/app-id: redpanda
        dapr.io/app-port: "9092"
    spec:
      containers:
      - name: redpanda
        image: vectorized/redpanda:v23.3.5
        ports:
        - containerPort: 9092
          name: kafka
          protocol: TCP
        - containerPort: 9644
          name: admin
          protocol: TCP
        - containerPort: 33145
          name: rpc
          protocol: TCP
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Starting Redpanda..."
          rm -rf /var/lib/redpanda/data/* || true
          redpanda --set redpanda.seed_servers=[] \
                    --set redpanda.developer_mode=true \
                    --set redpanda.auto_create_topics_enabled=true \
                    --set redpanda.enable_metrics=false \
                    --set redpanda.log_level=info \
                    --set redpanda.kafka_api=[{"address":"0.0.0.0","port":9092}] \
                    --set redpanda.advertised_kafka_api=[{"address":"$(hostname -f)","port":9092}] \
                    --set redpanda.rpc_server=[{"address":"0.0.0.0","port":33145}] \
                    --set redpanda.advertised_rpc_api=[{"address":"$(hostname -f)","port":33145}] \
                    --set redpanda.admin=[{"address":"0.0.0.0","port":9644}] \
                    --smp 1 \
                    --memory 512M \
                    --reserve-memory 0M \
                    --overprovisioned
        volumeMounts:
        - name: data
          mountPath: /var/lib/redpanda/data
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              rpk cluster info && \
              rpk cluster health
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              rpk cluster info && \
              rpk cluster health
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-service
  namespace: default
  labels:
    app: redpanda
spec:
  type: ClusterIP
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
    protocol: TCP
  - name: admin
    port: 9644
    targetPort: 9644
    protocol: TCP
  - name: rpc
    port: 33145
    targetPort: 33145
    protocol: TCP
  selector:
    app: redpanda
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-kafka-bootstrap
  namespace: default
  labels:
    app: redpanda
spec:
  type: ClusterIP
  ports:
  - name: kafka
    port: 9093
    targetPort: 9092
    protocol: TCP
  selector:
    app: redpanda
